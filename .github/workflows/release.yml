# create-release makes a GitHub release and passes it to build-release, which
# builds for each target and uploads it as a release asset.

name: release
on:
  push:
    # Enable when testing release infrastructure on a branch.
    # branches:
    # - ag/release
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions: {}
jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    # env:
    # Set to force version number, e.g., when no tag exists.
    # ARTIFACT_VERSION: TEST-0.0.0
    steps:
      - name: Get the release version from the tag
        if: env.ARTIFACT_VERSION == ''
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "ARTIFACT_VERSION=$REF_NAME" >> "$GITHUB_ENV"

      - name: Set version output
        id: version
        run: echo "version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$ARTIFACT_VERSION" >/dev/null 2>&1; then
            gh release edit "$ARTIFACT_VERSION" --title "$ARTIFACT_VERSION"
          else
            gh release create "$ARTIFACT_VERSION" --title "$ARTIFACT_VERSION" --notes "" --verify-tag
          fi

  build-release:
    name: build-release
    needs: ["create-release"]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
      RUST_BACKTRACE: 1
      TARGET: x86_64-apple-darwin
      EXE_NAME: criner
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --verbose --release --target "$TARGET"

      - name: Strip release binary
        run: strip "target/$TARGET/release/$EXE_NAME"

      - name: Build archive
        shell: bash
        run: |
          staging="${EXE_NAME}-${RELEASE_VERSION}-${TARGET}"
          mkdir -p "$staging"

          cp {README.md,LICENSE.md,CHANGELOG.md} "$staging/"
          cp "target/${TARGET}/release/${EXE_NAME}" "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_VERSION" "$ASSET" --clobber
