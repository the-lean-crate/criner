[package]
name = "criner"
version = "0.4.1"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
description = "a platform for resumable mining of crates.io for knowledge and information"
license = "MIT"
repository = "https://github.com/the-lean-crate/criner"
readme = "README.md"
include = ["src/**/*", "LICENSE.md", "README.md", "!**/*_test/*"]

[features]
default = []
migration = ["jwalk"]

[lib]
doctest = false

# needed to pin feature set on crates-index-diff's transitive gix (Send bounds)
[package.metadata.cargo-shear]
ignored = ["gix-for-configuration"]

[dependencies]
quick-error = "2.0.1"
futures-util = { version = "0.3.32", default-features = false, features = ["io", "sink"]}
crates-index-diff = "30.0.0"
gix-for-configuration = { package = "gix", version = "0.84.0", features = ["parallel"] }
git2 = { version = "0.21.0", default-features = false, features = ["https"] }
prodash = { version = "31.0.0", default-features = false, features = ["render-tui", "render-tui-crossterm", "local-time", "progress-tree", "progress-tree-log"] }
hex = "0.4.3"
rmp-serde = "1.3.1"
serde_derive = "1.0.228"
serde = "1.0.228"
humantime = "2.3.0"
log = "0.4.32"
reqwest = { version = "0.13.4", features = ["gzip"] }
http = { version = "1.4.2", default-features = false }
jwalk = { version = "0.8.1", optional = true }
tar = "0.4.46"
libflate = "2.3.0"
bytesize = "2.4.0"
rmpv = "1.3.1"
rusqlite = { version = "0.40.1", features = ["bundled", "unlock_notify"] }
parking_lot = "0.12.5"
async-trait = "0.1.89"
dia-semver = "11.0.1"
futures-lite = "2.6.1"
blocking = "1.6.2"
async-channel = "2.5.0"
once_cell = "1.21.4"
async-executor = "1.14.0"
async-io = "2.6.0"
async-compat = "0.2.5" # increase this version to get more recent tokio releases
# for properly shutting down the GUI when SIGTERM is sent directly
ctrlc = { version = "3.5.2", features = ["termination"] }
time = { version = "0.3.49", features = ["formatting", "local-offset", "macros", "parsing"] }

# for parsing csv files contained in crates-db-download
csv = "1.4.0"
# for deleting old database dumps - they remain on disk for a day at most
glob = "0.3.3"

# For 'export' functionality only (embed json in SQL text for simplicity) and for some fields in crates-io csv download
serde_json = "1.0.150"
globset = "0.4.18"
horrorshow = "0.8.9"
regex = "1.12.4"
lazy_static = "1.5.0"
criner-waste-report = { version = "^0.1.6", path = "../criner-waste-report" }

[dev-dependencies]
common_macros = "0.1.1"
