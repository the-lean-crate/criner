[package]
name = "criner-waste-report"
version = "0.1.5"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
description = "Determine include directives for Cargo.toml files to slim down a crate"
license = "MIT"
repository = "https://github.com/the-lean-crate/criner"
readme = "README.md"
include = ["src/**/*", "LICENSE.md", "README.md", "CHANGELOG.md", "!**/test/**/*"]

[lib]
doctest = false

[features]
default = ["html"]
html = ["horrorshow", "bytesize", "dia-semver", "humantime"]

[dependencies]
serde_derive = "1.0.228"
serde = "1.0.228"
toml = "1.1.2"
globset = "0.4.18"
regex = "1.12.4"
lazy_static = "1.5.0"

# for html
horrorshow = { version = "0.8.9", optional = true }
bytesize = { version = "2.4.0", optional = true }
dia-semver = { version = "11.0.1", optional = true }
humantime = { version = "2.3.0", optional = true }

[dev-dependencies]
rmp-serde = "1.3.1"
